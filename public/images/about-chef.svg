<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="chefBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#445840" />
      <stop offset="50%" stop-color="#2c3a2a" />
      <stop offset="100%" stop-color="#141e15" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ACC5A6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#141e15" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#chefBg)" />
  <circle cx="400" cy="400" r="350" fill="url(#glow)" />
  
  <!-- Subtle silhouette / culinary illustration -->
  <g transform="translate(250, 250)" stroke="#ACC5A6" stroke-width="3" fill="none" opacity="0.85">
    <!-- Chef Hat -->
    <path d="M 50 150 C 20 150 10 110 30 80 C 10 50 40 20 80 30 C 110 5 160 5 190 30 C 230 15 260 50 240 80 C 260 110 250 150 220 150 Z" fill="#5c7057" stroke="#ACC5A6" stroke-width="4"/>
    <path d="M 40 150 L 230 150 L 225 180 L 45 180 Z" fill="#445840" stroke="#ACC5A6" stroke-width="3"/>
    
    <!-- Crossed Kitchen Utensils -->
    <line x1="60" y1="230" x2="210" y2="350" stroke="#dcf3d4" stroke-width="6" stroke-linecap="round"/>
    <line x1="210" y1="230" x2="60" y2="350" stroke="#dcf3d4" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <text x="400" y="720" font-family="'Epilogue', sans-serif" font-size="32" font-weight="700" fill="#FAF9F6" text-anchor="middle" letter-spacing="1">DAPUR ARTISANAL</text>
  <text x="400" y="765" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500" fill="#ACC5A6" text-anchor="middle">DUCK DUCK COOK</text>
  <text x="400" y="810" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#dae6d8" opacity="0.8" text-anchor="middle">Merintis dari Jalanan Menuju Cita Rasa Berkelas</text>
</svg>

