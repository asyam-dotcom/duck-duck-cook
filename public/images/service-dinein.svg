<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B4739" />
      <stop offset="100%" stop-color="#141e15" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#FAF9F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#141e15" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgDine)" />
  <circle cx="400" cy="180" r="280" fill="url(#lampGlow)" />
  
  <!-- Dining table & chair aesthetic -->
  <g stroke="#ACC5A6" stroke-width="3" fill="none" opacity="0.9">
    <!-- Pendant lamp -->
    <line x1="400" y1="0" x2="400" y2="150" stroke="#dcf3d4" stroke-width="2" />
    <path d="M 360 180 Q 400 130 440 180 Z" fill="#dcf3d4" opacity="0.8" />
    
    <!-- Table -->
    <ellipse cx="400" cy="420" rx="260" ry="60" fill="#445840" stroke="#ACC5A6" stroke-width="4" />
    <line x1="400" y1="480" x2="400" y2="560" stroke="#ACC5A6" stroke-width="8" stroke-linecap="round" />
    <line x1="280" y1="560" x2="520" y2="560" stroke="#ACC5A6" stroke-width="8" stroke-linecap="round" />
  </g>
  
  <text x="400" y="320" font-family="'Epilogue', sans-serif" font-size="28" font-weight="700" fill="#FAF9F6" text-anchor="middle">DINE-IN &amp; RESTO EKSKLUSIF</text>
  <text x="400" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#ceebc5" text-anchor="middle">Suasana Hangat &amp; Berkelas</text>
</svg>

