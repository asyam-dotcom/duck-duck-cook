<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFrozen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#354d31" />
      <stop offset="100%" stop-color="#141e15" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgFrozen)" />
  
  <!-- Snowflake & Vacuum Pack Icon -->
  <g transform="translate(300, 140)" stroke="#ceebc5" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="100" cy="100" r="80" stroke="#ACC5A6" stroke-width="3" stroke-dasharray="8 6" />
    <!-- Snowflake -->
    <line x1="100" y1="50" x2="100" y2="150" stroke-width="5" />
    <line x1="50" y1="100" x2="150" y2="100" stroke-width="5" />
    <line x1="65" y1="65" x2="135" y2="135" stroke-width="4" />
    <line x1="135" y1="65" x2="65" y2="135" stroke-width="4" />
  </g>
  
  <text x="400" y="440" font-family="'Epilogue', sans-serif" font-size="28" font-weight="700" fill="#FAF9F6" text-anchor="middle">FROZEN READY-TO-HEAT PACK</text>
  <text x="400" y="480" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#ceebc5" text-anchor="middle">Teknologi Blast-Freeze, Siap Saji 12 Menit</text>
</svg>

